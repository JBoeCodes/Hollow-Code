# Playwright browser smoke (desktop + narrow Chromium against `?mock=1`; the
# config starts the Vite dev server itself). Linux, because the suite runs in
# Chromium against the browser mock and needs nothing from macOS, and Linux
# minutes cost a fraction of macOS ones (2026-10-03, owner: fewer, cheaper CI
# runs). Only on pull requests that change what the browser renders, or by hand.
name: smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/smoke.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Its own port, so the config sets reuseExistingServer:false and
      # --strictPort: the suite can only ever test this checkout's dev server.
      PW_PORT: 4417
      # Same zone as the operator's machine, where the suite's date-sensitive
      # specs were written.
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium --with-deps
      - run: npm run test:smoke -- --workers=2
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
